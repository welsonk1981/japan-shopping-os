<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping OS</title><style>
:root{--bg:#f4f4f0;--panel:#e8efe9;--border:#cfdbd1;--active:#315f4c;--sub:#f4e9df;--subactive:#9b5f35;--ink:#17202a}

/* 上方操作區視覺辨識優化 */

<style id="shoppingTripStyles">

x;border:1px solid #ccc;background:#fff;font-weight:700}.purchase-actions .primary{background:#111;color:#fff}.history-list{font-size:12px;line-height:1.7;max-height:180px;overflow:auto;margin:8px 0 14px}@media(max-width:640px){.tripbar{margin-top:8px;padding:7px 8px;gap:6px;min-height:46px}.tripbar strong{font-size:12px;max-width:34%}.tripbar #tripCount{font-size:11px}.tripbar button{font-size:11px!important;min-height:30px!important;padding:5px 7px!important}.tripbar #tripSettings{width:32px;min-width:32px;font-size:15px!important}.buy-state{top:7px;right:7px;width:34px;height:34px;min-width:34px!important;min-height:34px!important;font-size:19px!important}}

</head><body>
<header>
  <h1>Shopping OS</h1>
  <p class="header-subtitle">日本採買系統</p>
  <p class="meta">{{META}}</p>
</header>
<section class="toolbar"><div class="search-wrap"><input id="search" class="search" placeholder="搜尋商品…"></div><div class="filter-section-title">商品分類</div><nav class="filters"><button class="main-filter active" data-filter="全部">全部</button><button class="main-filter " data-filter="藥妝">藥妝</button><button class="main-filter " data-filter="無印良品">無印良品</button><button class="main-filter " data-filter="超商">超商</button><button class="main-filter " data-filter="BIC Camera">BIC Camera</button><button class="main-filter " data-filter="超市">超市</button><button class="main-filter " data-filter="伴手禮店">伴手禮店</button><button class="main-filter " data-filter="Outlet">Outlet</button><button class="main-filter " data-filter="北海道大學">北海道大學</button></nav></section>
<section id="subpanel" class="subpanel"><nav class="filters"><button class="sub-filter subactive" data-subfilter="全部藥妝">全部藥妝</button><button class="sub-filter " data-subfilter="保健">保健</button><button class="sub-filter " data-subfilter="保養">保養</button><button class="sub-filter " data-subfilter="彩妝">彩妝</button><button class="sub-filter " data-subfilter="口腔">口腔</button><button class="sub-filter " data-subfilter="醫藥">醫藥</button></nav></section>

{{GUIDES}}
<main id="productGrid" class="grid">{{CARDS}}</main>
<script>
const cards = [...document.querySelectorAll('#productGrid .card')];
const mainBtns = [...document.querySelectorAll('.main-filter')];
const subBtns = [...document.querySelectorAll('.sub-filter')];
const search = document.getElementById('search');
const subpanel = document.getElementById('subpanel');

let main = '全部';
let sub = '全部藥妝';
let q = '';
let purchaseTodoOnly = false;

function render() {
  cards.forEach(card => {
    let visible = main === '全部' || card.dataset.channel === main;

    if (visible && main === '藥妝' && sub !== '全部藥妝') {
      visible = card.dataset.subcategory === sub;
    }

    if (visible && q) {
      visible = (card.dataset.search || '').toLowerCase().includes(q);
    }

    if (visible && purchaseTodoOnly) {
      visible = (card.dataset.buyState || 'todo') === 'todo';
    }

    card.hidden = !visible;
  });
}

mainBtns.forEach(button => {
  button.addEventListener('click', () => {
    main = button.dataset.filter;
    sub = '全部藥妝';

    mainBtns.forEach(item => item.classList.remove('active'));
    button.classList.add('active');

    subBtns.forEach(item => item.classList.remove('subactive'));
    const allDrugButton = document.querySelector('[data-subfilter="全部藥妝"]');
    if (allDrugButton) allDrugButton.classList.add('subactive');

    subpanel.classList.toggle('visible', main === '藥妝');
    render();
  });
});

subBtns.forEach(button => {
  button.addEventListener('click', () => {
    sub = button.dataset.subfilter;

    subBtns.forEach(item => item.classList.remove('subactive'));
    button.classList.add('subactive');

    render();
  });
});

search.addEventListener('input', () => {
  q = search.value.trim().toLowerCase();
  render();
});

render();
</script>
<script id="shoppingTripFeature">
(()=>{
const KEY='shoppingOS.purchase.v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{current:null,history:[]}}catch(e){return{current:null,history:[]}}};
let data=load(), onlyTodo=false;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const cards=[...document.querySelectorAll('#productGrid .card')];
const productKey=c=>c.dataset.search||c.querySelector('h3')?.textContent.trim()||String(cards.indexOf(c));
function ensureTrip(){if(!data.current)data.current={name:'本次採買',created:new Date().toISOString(),states:{}};}
ensureTrip();
const toolbar=document.querySelector('.toolbar');
const bar=document.createElement('div');bar.className='tripbar';bar.innerHTML='<strong id="tripName"></strong><span id="tripCount"></span><span class="spacer"></span><button id="todoToggle" type="button">只看未買</button><button id="tripSettings" type="button" aria-label="採買設定" title="採買設定">⚙︎</button>';toolbar.appendChild(bar);
const modal=document.createElement('div');modal.className='purchase-modal';modal.innerHTML='<div class="purchase-box"><h2>採買設定</h2><label>本次採買名稱</label><input id="tripNameInput"><div id="tripSummary"></div><div class="history-list" id="tripHistory"></div><div class="purchase-actions"><button id="newTrip">＋ 開始新一輪採買</button><button id="closeTrip" class="primary">完成</button></div></div>';document.body.appendChild(modal);
cards.forEach(c=>{const b=document.createElement('button');b.className='buy-state';b.type='button';b.addEventListener('click',()=>{const k=productKey(c),s=data.current.states[k]||'todo';data.current.states[k]=s==='todo'?'bought':s==='bought'?'skip':'todo';save();paint();render();});c.appendChild(b);
c.addEventListener('click',(e)=>{
  if(e.target.closest('button,summary,details,a,input'))return;
  const k=productKey(c),s=data.current.states[k]||'todo';
  if(s==='todo'){
    data.current.states[k]='bought';
    save();paint();render();
  }
});
});
function paint(){let bought=0,todo=0,skip=0;cards.forEach(c=>{const s=data.current.states[productKey(c)]||'todo';c.dataset.buyState=s;const b=c.querySelector('.buy-state');if(b){const label=s==='bought'?'已買':s==='skip'?'跳過':'未買';b.textContent=s==='bought'?'✓':s==='skip'?'—':'';b.setAttribute('aria-label',label);b.title=label;}if(s==='bought')bought++;else if(s==='skip')skip++;else todo++;});document.getElementById('tripName').textContent='🧳 '+data.current.name;document.getElementById('tripCount').textContent=`${bought} / ${cards.length} 已買`;document.getElementById('todoToggle').classList.toggle('active',onlyTodo);}
document.getElementById('todoToggle').onclick=()=>{onlyTodo=!onlyTodo;purchaseTodoOnly=onlyTodo;paint();render();};
document.getElementById('tripSettings').onclick=()=>{document.getElementById('tripNameInput').value=data.current.name;const vals=Object.values(data.current.states);document.getElementById('tripSummary').textContent=`已買 ${vals.filter(x=>x==='bought').length}　跳過 ${vals.filter(x=>x==='skip').length}`;document.getElementById('tripHistory').innerHTML='<b>過去採買紀錄</b><br>'+((data.history||[]).map(x=>`${x.name}　✓ ${Object.values(x.states||{}).filter(v=>v==='bought').length} 件`).join('<br>')||'尚無紀錄');modal.classList.add('open');};
document.getElementById('closeTrip').onclick=()=>{const n=document.getElementById('tripNameInput').value.trim();if(n)data.current.name=n;save();modal.classList.remove('open');paint();};
document.getElementById('newTrip').onclick=()=>{if(!confirm('建立新的採買紀錄？目前紀錄會保留，商品會全部恢復為「未買」。'))return;data.history=data.history||[];data.history.unshift(data.current);data.current={name:'新一輪採買',created:new Date().toISOString(),states:{}};save();modal.classList.remove('open');paint();};
paint();
})();
</script>
</body></html>
